services:
  app:
    image: devops-lab8-app:1.0
    container_name: lab8-compose-app
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: lab8-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  nginx:
    image: nginx:alpine
    container_name: lab8-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
